$("imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX)return sToast(t("xlNet"));
 const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),sn=wb.SheetNames.find(n=>/item/i.test(n))||wb.SheetNames.find(n=>XLSX.utils.sheet_to_json(wb.Sheets[n])[0]?.Item!==undefined)||wb.SheetNames[0];
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""}),g=(r,...k)=>{for(const x of Object.keys(r))if(k.some(y=>x.trim().toLowerCase()==y))return r[x];return""};
 const by={},exist=new Set(Object.values(db.grv).map(x=>x.no));
 rows.forEach(r=>{const item=String(g(r,"item","description","name")).trim();if(!item)return;const no=String(g(r,"grv no","grv")).trim(),po=String(g(r,"po no","po","order","order no","purchase no")).trim();const ct=String(g(r,"container no","container","container number")).trim().toUpperCase(),vin=String(g(r,"vin","chassis","vin no")).trim().toUpperCase();const key=no||"PO:"+(po||"none")+"|"+ct;let d=g(r,"date");d=d instanceof Date?d.toISOString().slice(0,10):String(d||today()).slice(0,10);
  const G=by[key]||(by[key]={no,date:d,sup:String(g(r,"supplier")).trim(),po,ct,by:String(g(r,"received by")).trim()||me_(),loc:String(g(r,"location","storage location")).trim(),note:t("impNote").replace("%f",f.name),photo:"",lines:[],at:nowLocal()});
  const rec=g(r,"qty received","received");G.lines.push({item,vin,unit:String(g(r,"unit")).trim(),ord:+g(r,"qty ordered","ordered","qty")||0,rec:rec===""?0:+rec,cond:CONDS.includes(String(g(r,"condition")).trim())?String(g(r,"condition")).trim():"Good"})});
 const all=Object.values(by);pendI=all.filter(x=>!exist.has(x.no));const skip=all.length-pendI.length;let mx=nextNo(pendI.map(x=>x.no));pendI.forEach(x=>{if(!x.no)x.no=fmtNo(++mx)});
 $("impPv").innerHTML=`<p style="color:#475569">${esc(t("impSum").replace("%s",sn).replace("%g",pendI.length).replace("%l",pendI.reduce((a,x)=>a+x.lines.length,0)))}${skip?" "+esc(t("impSkip").replace("%n",skip)):""}</p><div class="xgrid"><table><tr><th>GRV</th><th>${esc(t("date"))}</th><th>${esc(t("supplier"))}</th><th>PO</th><th>🚢</th><th>${esc(t("item"))}</th><th>VIN</th><th>${esc(t("qOrd"))}</th><th>${esc(t("qRec"))}</th></tr>${pendI.flatMap(x=>x.lines.map(l=>`<tr><td>${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(x.sup)}</td><td>${esc(x.po)}</td><td>${esc(x.ct)}</td><td>${esc(l.item)}</td><td>${esc(l.vin)}</td><td>${l.ord}</td><td>${l.rec}</td></tr>`)).join("")}</table></div>${pendI.length?`<button type="button" id="impOk">✅ ${esc(t("impOk"))}</button>`:""}<button type="button" class="sec" id="impNo">${esc(t("cancel"))}</button>`;
 if(pendI.length)$("impOk").onclick=()=>{pendI.forEach((x,i)=>change("grv",Date.now()+i+dev,x));sToast(t("impDone").replace("%n",pendI.length));clrI();resetForm();render()};$("impNo").onclick=clrI};
